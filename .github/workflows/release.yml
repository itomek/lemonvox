name: Protected draft release

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact reviewed main commit to build
        required: true
        type: string
      version:
        description: Release version (X.Y.Z)
        required: true
        type: string
      build_number:
        description: Increasing release build number (greater than latest published build)
        required: true
        type: string
      windows_store_version:
        description: Optional Store package version X.Y.Z.0 (requires Windows publisher variables)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: release
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_VERSION: ${{ inputs.version }}
      STORE_VERSION: ${{ inputs.windows_store_version }}
      STORE_PACKAGE_NAME: ${{ vars.WINDOWS_STORE_PACKAGE_NAME }}
      STORE_PUBLISHER: ${{ vars.WINDOWS_STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.WINDOWS_STORE_PUBLISHER_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source_commit }}
      - name: Verify exact reviewed main source
        shell: pwsh
        run: |
          if ($env:SOURCE_COMMIT -cnotmatch '^[0-9a-f]{40}$' -or (git rev-parse HEAD) -cne $env:SOURCE_COMMIT) { throw 'Expected exact reviewed source SHA' }
          git fetch --no-tags origin main
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify main' }
          git merge-base --is-ancestor $env:SOURCE_COMMIT origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Source is not on main' }
          if ($env:RELEASE_VERSION -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' -or $env:RELEASE_VERSION -eq '0.0.0') { throw 'Expected a public product version' }
          if ($env:STORE_VERSION -and (-not $env:STORE_PACKAGE_NAME -or -not $env:STORE_PUBLISHER -or -not $env:STORE_PUBLISHER_DISPLAY_NAME)) { throw 'Configure the exact reserved Partner Center identity first' }
      - name: Install manifest schema validation tools
        shell: pwsh
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.23.0
      - name: Build and validate Windows distribution
        shell: pwsh
        run: |
          windows\scripts\package.ps1 -Output "$env:RUNNER_TEMP\windows-package" -Version $env:RELEASE_VERSION
          windows\tests\distribution_test.ps1 -PackageDirectory "$env:RUNNER_TEMP\windows-package\LemonVox" -IconPath "$env:RUNNER_TEMP\windows-package\LemonVox\lemonvox.ico" -Output "$env:RUNNER_TEMP\windows-package-tests" -SchemaPython python
      - name: Prepare Windows draft assets and WinGet candidate
        shell: pwsh
        run: |
          $assets = "$env:RUNNER_TEMP\windows-release"
          New-Item -ItemType Directory $assets | Out-Null
          Get-ChildItem "$env:RUNNER_TEMP\windows-package" -File | Copy-Item -Destination $assets
          $url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/v$env:RELEASE_VERSION/LemonVox-$env:RELEASE_VERSION-windows-x64.exe"
          windows\scripts\new-winget-manifest.ps1 -Executable "$assets\LemonVox-$env:RELEASE_VERSION-windows-x64.exe" -Version $env:RELEASE_VERSION -PackageIdentifier LemonVox.LemonVox -Publisher 'LemonVox' -InstallerUrl $url -Output "$env:RUNNER_TEMP\winget-candidate" -Preview
          python windows/tests/validate_winget.py "$env:RUNNER_TEMP\winget-candidate"
          if ($LASTEXITCODE -ne 0) { throw 'WinGet candidate schema failed' }
          Compress-Archive -Path "$env:RUNNER_TEMP\winget-candidate\*" -DestinationPath "$assets\LemonVox-$env:RELEASE_VERSION-winget-candidate.zip"
          if ($env:STORE_VERSION) {
            windows\scripts\package-msix.ps1 -PackageDirectory "$env:RUNNER_TEMP\windows-package\LemonVox" -PackageName $env:STORE_PACKAGE_NAME -Publisher $env:STORE_PUBLISHER -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME -StoreVersion $env:STORE_VERSION -Output "$env:RUNNER_TEMP\store-candidate"
            Get-ChildItem "$env:RUNNER_TEMP\store-candidate" -File | Copy-Item -Destination $assets
          }
          Get-ChildItem $assets -File | Where-Object Name -ne 'SHA256SUMS-windows-x64.txt' | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -Encoding ASCII "$assets\SHA256SUMS-windows-x64.txt"
      - name: Upload validated Windows assets for the single draft release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: ${{ runner.temp }}/windows-release/*
          if-no-files-found: error
          retention-days: 7
  release:
    needs: windows
    # Manual dispatch still requires the protected release environment approval.
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: release
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BUILD: ${{ inputs.build_number }}
      SIGNING_IDENTITY: ${{ vars.SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source_commit }}
      - name: Validate release input and destination
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_BUILD" =~ ^[1-9][0-9]*$ ]]
          # Latest may be Windows-only; inspect all pages for the last public macOS release.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --slurp > "$RUNNER_TEMP/latest-release.json"
          PREVIOUS_BUILD=$(python3 scripts/latest-release-build.py "$RUNNER_TEMP/latest-release.json")
          test "$RELEASE_BUILD" -gt "$PREVIOUS_BUILD"
          echo "PREVIOUS_BUILD=$PREVIOUS_BUILD" >> "$GITHUB_ENV"
          test "$(uname -m)" = arm64
          # Distinguish a missing release from a network/authentication failure.
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$RELEASE_VERSION" > "$RUNNER_TEMP/tags.json"
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --slurp > "$RUNNER_TEMP/releases.json"
          python3 - <<'PY'
          import json, os
          releases=[r for page in json.load(open(os.environ['RUNNER_TEMP']+'/releases.json')) for r in page]
          assert all(r['tag_name'] != 'v'+os.environ['RELEASE_VERSION'] for r in releases), 'Release already exists'
          tags=json.load(open(os.environ['RUNNER_TEMP']+'/tags.json'))
          assert all(t['ref'] != 'refs/tags/v'+os.environ['RELEASE_VERSION'] for t in tags), 'Tag already exists; reconcile before release'
          PY
      - name: Download validated Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release
          path: ${{ runner.temp }}/windows-release
      - name: Verify Windows artifact provenance and hashes
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'windows-release'
          version = (root / 'VERSION-windows-x64.txt').read_text().splitlines()
          assert version[0] == os.environ['RELEASE_VERSION']
          assert 'source: ' + os.environ['SOURCE_COMMIT'] in version, 'Windows source mismatch or dirty tree'
          for entry in (root / 'SHA256SUMS-windows-x64.txt').read_text().splitlines():
              digest, name = entry.split('  ', 1)
              assert pathlib.Path(name).name == name, 'Invalid artifact name'
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest, name
          PY
      - name: Import approved signing identity into temporary Keychain
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          umask 077
          KEYCHAIN="$RUNNER_TEMP/lemonvox-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$SIGNING_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          rm "$RUNNER_TEMP/signing.p12"
          xcrun notarytool store-credentials lemonvox-ci --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$KEYCHAIN"
      - name: Build and sign reviewed source
        run: |
          bash scripts/package-macos.sh --identity "$SIGNING_IDENTITY" --output "$RUNNER_TEMP/signed" --version "$RELEASE_VERSION" --build-number "$RELEASE_BUILD"
          bash tests/packaging_test.sh "$RUNNER_TEMP/signed/LemonVox-$RELEASE_VERSION-$RELEASE_BUILD-arm64-developer-id.zip"
      - name: Submit once to Apple
        run: |
          # Never automatically retry submit. A failed/uncertain upload requires
          # reconciliation against notarytool history before a new workflow run.
          xcrun notarytool submit "$RUNNER_TEMP/signed/LemonVox-$RELEASE_VERSION-$RELEASE_BUILD-arm64-developer-id.zip" --keychain-profile lemonvox-ci --keychain "$RUNNER_TEMP/lemonvox-signing.keychain-db" --output-format json > "$RUNNER_TEMP/submission.json"
          python3 - <<'PY'
          import json, os
          submission=json.load(open(os.environ['RUNNER_TEMP']+'/submission.json'))
          print('Apple submission ID: '+submission['id'])
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('NOTARY_ID='+submission['id']+'\n')
          PY
      - name: Wait, inspect log and staple
        run: |
          xcrun notarytool wait "$NOTARY_ID" --keychain-profile lemonvox-ci --keychain "$RUNNER_TEMP/lemonvox-signing.keychain-db" --timeout 60m --output-format json > "$RUNNER_TEMP/status.json"
          xcrun notarytool log "$NOTARY_ID" "$RUNNER_TEMP/notary-log.json" --keychain-profile lemonvox-ci --keychain "$RUNNER_TEMP/lemonvox-signing.keychain-db"
          python3 - <<'PY'
          import json, os
          root=os.environ['RUNNER_TEMP']
          assert json.load(open(root+'/status.json'))['status']=='Accepted'
          log=json.load(open(root+'/notary-log.json'))
          assert log['status']=='Accepted' and not log['issues'], 'Inspect Apple notarization report before release'
          PY
          xcrun stapler staple "$RUNNER_TEMP/signed/LemonVox.app"
          xcrun stapler validate "$RUNNER_TEMP/signed/LemonVox.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/signed/LemonVox.app"
          spctl --assess --type execute "$RUNNER_TEMP/signed/LemonVox.app"
      - name: Prepare final distribution
        run: |
          mkdir "$RUNNER_TEMP/distribution"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/signed/LemonVox.app" "$RUNNER_TEMP/distribution/LemonVox-$RELEASE_VERSION-arm64.zip"
          bash tests/packaging_test.sh "$RUNNER_TEMP/distribution/LemonVox-$RELEASE_VERSION-arm64.zip"
          cd "$RUNNER_TEMP/distribution"
          shasum -a 256 "LemonVox-$RELEASE_VERSION-arm64.zip" > SHA256SUMS
      - name: Sign and validate final update feed
        env:
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "$SPARKLE_ED25519_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-key"
          bash scripts/prepare-update-feed.sh "$RUNNER_TEMP/distribution/LemonVox-$RELEASE_VERSION-arm64.zip" "$RELEASE_VERSION" "$PREVIOUS_BUILD" "$RUNNER_TEMP/sparkle-key"
          rm "$RUNNER_TEMP/sparkle-key"
      - name: Create draft release for final review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create the tag atomically. An existing/concurrently created tag
          # fails here instead of silently releasing a different source commit.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$RELEASE_VERSION" -f "sha=$SOURCE_COMMIT" >/dev/null
          gh release create "v$RELEASE_VERSION" "$RUNNER_TEMP/distribution/LemonVox-$RELEASE_VERSION-arm64.zip" "$RUNNER_TEMP/distribution/SHA256SUMS" "$RUNNER_TEMP/distribution/appcast.xml" "$RUNNER_TEMP/windows-release/"* --repo "$GITHUB_REPOSITORY" --verify-tag --target "$SOURCE_COMMIT" --title "LemonVox $RELEASE_VERSION" --draft --notes "Apple silicon macOS 26+ and Windows 11 x64. Requires Lemonade separately. macOS installs as LemonVox.app. Windows direct artifacts are unsigned; optional MSIX and WinGet candidates still require their documented installed-package and publication checks. Built from $SOURCE_COMMIT."
      - name: Remove temporary signing material
        if: ${{ always() }}
        run: |
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/sparkle-key"
          if test -f "$RUNNER_TEMP/lemonvox-signing.keychain-db"; then
            security delete-keychain "$RUNNER_TEMP/lemonvox-signing.keychain-db"
          fi
