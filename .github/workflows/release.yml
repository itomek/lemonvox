name: Release (awaiting signing setup)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (X.Y.Z)
        required: true
        type: string
      build_number:
        description: Increasing release build number (greater than latest published build)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Deliberately disabled. Enable only after the credential transfer and
    # release environment protection described in docs/automation.md are approved.
    if: ${{ false && github.ref == 'refs/heads/main' }}
    environment: release
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BUILD: ${{ inputs.build_number }}
      SIGNING_IDENTITY: ${{ vars.SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release input and destination
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_BUILD" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/latest-release.json"
          PREVIOUS_BUILD=$(python3 scripts/latest-release-build.py "$RUNNER_TEMP/latest-release.json")
          test "$RELEASE_BUILD" -gt "$PREVIOUS_BUILD"
          echo "PREVIOUS_BUILD=$PREVIOUS_BUILD" >> "$GITHUB_ENV"
          test "$(uname -m)" = arm64
          # Distinguish a missing release from a network/authentication failure.
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$RELEASE_VERSION" > "$RUNNER_TEMP/tags.json"
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --slurp > "$RUNNER_TEMP/releases.json"
          python3 - <<'PY'
          import json, os
          releases=[r for page in json.load(open(os.environ['RUNNER_TEMP']+'/releases.json')) for r in page]
          assert all(r['tag_name'] != 'v'+os.environ['RELEASE_VERSION'] for r in releases), 'Release already exists'
          tags=json.load(open(os.environ['RUNNER_TEMP']+'/tags.json'))
          assert all(t['ref'] != 'refs/tags/v'+os.environ['RELEASE_VERSION'] for t in tags), 'Tag already exists; reconcile before release'
          PY
      - name: Import approved signing identity into temporary Keychain
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          umask 077
          KEYCHAIN="$RUNNER_TEMP/lemonvox-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$SIGNING_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          rm "$RUNNER_TEMP/signing.p12"
          xcrun notarytool store-credentials lemonvox-ci --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$KEYCHAIN"
      - name: Build and sign reviewed source
        run: |
          bash scripts/package-macos.sh --identity "$SIGNING_IDENTITY" --output "$RUNNER_TEMP/signed" --version "$RELEASE_VERSION" --build-number "$RELEASE_BUILD"
          bash tests/packaging_test.sh "$RUNNER_TEMP/signed/LemonVox-$RELEASE_VERSION-$RELEASE_BUILD-arm64-developer-id.zip"
      - name: Submit once to Apple
        run: |
          # Never automatically retry submit. A failed/uncertain upload requires
          # reconciliation against notarytool history before a new workflow run.
          xcrun notarytool submit "$RUNNER_TEMP/signed/LemonVox-$RELEASE_VERSION-$RELEASE_BUILD-arm64-developer-id.zip" --keychain-profile lemonvox-ci --keychain "$RUNNER_TEMP/lemonvox-signing.keychain-db" --output-format json > "$RUNNER_TEMP/submission.json"
          python3 - <<'PY'
          import json, os
          submission=json.load(open(os.environ['RUNNER_TEMP']+'/submission.json'))
          print('Apple submission ID: '+submission['id'])
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('NOTARY_ID='+submission['id']+'\n')
          PY
      - name: Wait, inspect log and staple
        run: |
          xcrun notarytool wait "$NOTARY_ID" --keychain-profile lemonvox-ci --keychain "$RUNNER_TEMP/lemonvox-signing.keychain-db" --timeout 60m --output-format json > "$RUNNER_TEMP/status.json"
          xcrun notarytool log "$NOTARY_ID" "$RUNNER_TEMP/notary-log.json" --keychain-profile lemonvox-ci --keychain "$RUNNER_TEMP/lemonvox-signing.keychain-db"
          python3 - <<'PY'
          import json, os
          root=os.environ['RUNNER_TEMP']
          assert json.load(open(root+'/status.json'))['status']=='Accepted'
          log=json.load(open(root+'/notary-log.json'))
          assert log['status']=='Accepted' and not log['issues'], 'Inspect Apple notarization report before release'
          PY
          xcrun stapler staple "$RUNNER_TEMP/signed/LemonVox Prototype.app"
          xcrun stapler validate "$RUNNER_TEMP/signed/LemonVox Prototype.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/signed/LemonVox Prototype.app"
          spctl --assess --type execute "$RUNNER_TEMP/signed/LemonVox Prototype.app"
      - name: Prepare final distribution
        run: |
          mkdir "$RUNNER_TEMP/distribution"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/signed/LemonVox Prototype.app" "$RUNNER_TEMP/distribution/LemonVox-$RELEASE_VERSION-arm64.zip"
          bash tests/packaging_test.sh "$RUNNER_TEMP/distribution/LemonVox-$RELEASE_VERSION-arm64.zip"
          cd "$RUNNER_TEMP/distribution"
          shasum -a 256 "LemonVox-$RELEASE_VERSION-arm64.zip" > SHA256SUMS
      - name: Sign and validate final update feed
        env:
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "$SPARKLE_ED25519_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-key"
          bash scripts/prepare-update-feed.sh "$RUNNER_TEMP/distribution/LemonVox-$RELEASE_VERSION-arm64.zip" "$RELEASE_VERSION" "$PREVIOUS_BUILD" "$RUNNER_TEMP/sparkle-key"
          rm "$RUNNER_TEMP/sparkle-key"
      - name: Create draft release for final review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create the tag atomically. An existing/concurrently created tag
          # fails here instead of silently releasing a different source commit.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$RELEASE_VERSION" -f "sha=$GITHUB_SHA" >/dev/null
          gh release create "v$RELEASE_VERSION" "$RUNNER_TEMP/distribution/LemonVox-$RELEASE_VERSION-arm64.zip" "$RUNNER_TEMP/distribution/SHA256SUMS" "$RUNNER_TEMP/distribution/appcast.xml" --repo "$GITHUB_REPOSITORY" --verify-tag --target "$GITHUB_SHA" --title "LemonVox $RELEASE_VERSION" --draft --notes "Apple silicon, macOS 26+. Requires Lemonade separately. Installs as LemonVox Prototype.app. Built from $GITHUB_SHA."
      - name: Remove temporary signing material
        if: ${{ always() }}
        run: |
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/sparkle-key"
          if test -f "$RUNNER_TEMP/lemonvox-signing.keychain-db"; then
            security delete-keychain "$RUNNER_TEMP/lemonvox-signing.keychain-db"
          fi
