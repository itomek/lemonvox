name: Publish Ubuntu packages
on:
  pull_request:
    paths:
      - .github/workflows/ubuntu-release.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/ubuntu-release.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ubuntu-release
  cancel-in-progress: false
jobs:
  package:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build g++ pkg-config libgtk-4-dev libadwaita-1-dev libsoup-3.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good gstreamer1.0-pulseaudio gjs libglib2.0-bin desktop-file-utils
      - name: Build and test package
        run: bash scripts/build-ubuntu.sh --output "$RUNNER_TEMP/packages" --version 0.2.1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ubuntu-${{ runner.arch }}
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ubuntu-*
          merge-multiple: true
          path: packages
      - name: Verify and publish Ubuntu release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          cd packages
          for arch in amd64 arm64; do
            test "$(dpkg-deb -f "lemonvox_0.2.1_${arch}.deb" Package)" = lemonvox
            test "$(dpkg-deb -f "lemonvox_0.2.1_${arch}.deb" Architecture)" = "$arch"
            test "$(dpkg-deb -f "lemonvox_0.2.1_${arch}.deb" Version)" = 0.2.1
            expected=$(awk '{print $1}' "SHA256SUMS-ubuntu-${arch}.txt")
            actual=$(sha256sum "lemonvox_0.2.1_${arch}.deb" | awk '{print $1}')
            test "$actual" = "$expected"
          done
          cat > notes.md <<'NOTES'
          Ubuntu 24.04 GNOME 46 Wayland packages with automatic paste into the current focus after Stop and transcription/cleanup. Includes native Settings, configurable global shortcuts and a nonactivating dictation bar.

          Download the .deb matching your architecture and run sudo apt install ./lemonvox_0.2.1_ARCH.deb. Requires Lemonade or another compatible OpenAI API server running separately, with a local loopback endpoint, audio transcription, chat completion and compatible model-discovery metadata. Enable the LemonVox GNOME extension, then log out and back in after first install or an extension upgrade. Paste replaces clipboard contents and sends Ctrl+V without Enter.

          Live microphone dictation and automatic paste were owner-verified on Ubuntu arm64. Packages for both architectures pass their build and CTest checks. These are downloadable Debian packages. Public APT repository hosting remains pending.
          NOTES
          gh release create ubuntu-v0.2.1 --target "$RELEASE_COMMIT" --title "LemonVox 0.2.1 for Ubuntu" --notes-file notes.md --latest=false ./*.deb ./SHA256SUMS-* ./VERSION-*
